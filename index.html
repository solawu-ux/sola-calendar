<div id="loading" class="loading"><div class="loading-card"><div style="font-family:'Noto Serif TC',serif;font-size:22px;font-weight:600">🐻 Sola 個人行事曆 🐶</div><div class="loading-dots"><i></i><i></i><i></i></div><div style="font-size:12px;margin-top:10px;color:var(--muted)">資料載入中…</div></div></div>
<header id="topHeader"><div class="head-left"><div class="title">🐻 Sola 個人行事曆 🐶</div><div class="subline"><span id="liveClock"></span><span id="subLabel"></span></div></div><div class="head-right"><button class="nav" id="prevBtn">‹</button><div class="month" id="monthDisplay"></div><button class="nav" id="nextBtn">›</button><button class="today" id="todayBtn">本月</button><div class="view-toggle" aria-label="顯示模式"><button id="calendarModeBtn" class="active">月曆</button><button id="listModeBtn">清單</button></div></div></header>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,setDoc,onSnapshot,enableIndexedDbPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBthGtXaHLWh1gFUOIZEvjMt0k8Mb_MK-4',authDomain:'project-7282357549927797183.firebaseapp.com',projectId:'project-7282357549927797183',storageBucket:'project-7282357549927797183.firebasestorage.app',messagingSenderId:'559099894928',appId:'1:559099894928:web:7842e278956c0d09f00c15',measurementId:'G-HGZQ5RLRND'};
const fb=initializeApp(firebaseConfig),db=getFirestore(fb);enableIndexedDbPersistence(db).catch(()=>{});
const MIN_YEAR=2026,MIN_MONTH=5,MAX_YEAR=2032,MAX_MONTH=7;
const CATEGORIES=Array.from({length:10},(_,i)=>{const n=i+1;return{id:'t'+n,label:String(n),chipClass:'cat-t'+n,bgClass:'bg-t'+n,dotClass:'dot-t'+n}});
const SRC_CATS=[['school','學校'],['admin','教務'],['teach','教學'],['reg','註冊'],['equip','設備'],['info','資訊']].map(([id,label])=>({id,label,chipClass:'cat-'+id,dotClass:'dot-'+id}));
const WEEKDAYS=['一','二','三','四','五','六','日'];
const today=new Date();let currentYear=today.getFullYear(),currentMonth=today.getMonth()+1;if(currentYear<MIN_YEAR||(currentYear===MIN_YEAR&&currentMonth<MIN_MONTH)){currentYear=MIN_YEAR;currentMonth=MIN_MONTH}if(currentYear>MAX_YEAR||(currentYear===MAX_YEAR&&currentMonth>MAX_MONTH)){currentYear=MAX_YEAR;currentMonth=MAX_MONTH}
let DATA={},SOURCE_DATA={},orderData={},modalDateStr='',tempData={},unsub=null,unsubSrc=null,viewMode='calendar';
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),dateKey=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
function setSync(cls,text){$('syncStatus').className='sync'+(cls?' '+cls:'');$('syncStatus').textContent=text}
function hideLoading(){const x=$('loading');if(x){x.classList.add('hide');setTimeout(()=>x.remove(),350)}}
function academic(y,m){const a=m>=8?y:y-1;return `${a}/08－${a+1}/07　${a-1911} 學年度`}
function getDay(ds){if(!DATA[ds])DATA[ds]={};CATEGORIES.forEach(c=>{if(!DATA[ds][c.id])DATA[ds][c.id]=[{text:'',done:false}]});return DATA[ds]}
function getOrder(ds){const o=orderData[ds];return o&&o.length===CATEGORIES.length?[...o]:CATEGORIES.map(c=>c.id)}
function listenSourceMonth(y,m){if(unsubSrc)unsubSrc();SOURCE_DATA={};unsubSrc=onSnapshot(doc(db,'calendar',`${y}-${pad(m)}`),snap=>{SOURCE_DATA=snap.data()?.days||{};render()},e=>console.error(e))}
function listenMonth(y,m){if(unsub)unsub();DATA={};orderData={};render();setSync('saving','同步中…');unsub=onSnapshot(doc(db,'sola_calendar',`${y}-${pad(m)}`),snap=>{if(snap.exists()){DATA=snap.data().days||{};orderData=snap.data().orders||{}}setSync('','已連線');hideLoading();render()},e=>{console.error(e);setSync('error','連線失敗');hideLoading()});listenSourceMonth(y,m)}
async function saveToFirebase(ds,dayData,order){setSync('saving','儲存中…');try{const[y,m]=ds.split('-');await setDoc(doc(db,'sola_calendar',`${y}-${m}`),{days:{[ds]:dayData},orders:{[ds]:order}},{merge:true});setSync('','已儲存 ✓');setTimeout(()=>setSync('','已連線'),1500)}catch(e){console.error(e);setSync('error','儲存失敗')}}
function personalChips(ds){const a=[];if(DATA[ds])getOrder(ds).forEach(id=>{const c=CATEGORIES.find(x=>x.id===id);(DATA[ds][id]||[]).forEach(it=>{if(it.text?.trim())a.push({cat:c,label:it.text,done:!!it.done})})});const [y,m,d]=ds.split('-').map(Number),dow=new Date(y,m-1,d).getDay();if(dow===1&&!a.some(x=>x.label==='主管會議'))a.push({cat:CATEGORIES[0],label:'主管會議',done:false,recurring:true});if(dow===5&&!a.some(x=>x.label==='準備主管會議資料'))a.push({cat:CATEGORIES[1],label:'準備主管會議資料',done:false,recurring:true});return a}
function schoolChips(ds){const a=[],src=SOURCE_DATA[ds];if(src)SRC_CATS.forEach(c=>(src[c.id]||[]).forEach(it=>{if(it.event||it.time||it.place)a.push({cat:c,label:`${c.label} ${it.event||it.time||it.place}`})}));return a}
function allChips(ds){return [...personalChips(ds),...schoolChips(ds)]}
function updateSticky(){document.documentElement.style.setProperty('--header-h',Math.ceil($('topHeader').getBoundingClientRect().height)+'px')}

async function copyText(value,button){
  try{
    if(navigator.clipboard&&window.isSecureContext) await navigator.clipboard.writeText(value);
    else { const ta=document.createElement('textarea'); ta.value=value; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    if(button){const old=button.textContent;button.textContent='✓';button.classList.add('done');setTimeout(()=>{button.textContent=old;button.classList.remove('done')},1000)}
  }catch{if(button){const old=button.textContent;button.textContent='!';setTimeout(()=>button.textContent=old,1000)}}
}
function renderList(){
  const root=$('listView'); if(!root)return; root.innerHTML='';
  const days=new Date(currentYear,currentMonth,0).getDate(); let any=false;
  for(let d=1;d<=days;d++){
    const ds=dateKey(currentYear,currentMonth,d), personal=personalChips(ds), school=schoolChips(ds), holiday=!!SOURCE_DATA[ds]?.holiday;
    if(!personal.length&&!school.length&&!holiday) continue; any=true;
    const sec=document.createElement('section'); sec.className='list-day';
    const dt=new Date(currentYear,currentMonth-1,d), w=['日','一','二','三','四','五','六'][dt.getDay()];
    const head=document.createElement('div'); head.className='list-date'; head.innerHTML=`<span>${currentMonth} / ${d}</span><small>星期${w}${holiday?' · 放假':''}</small>`; sec.appendChild(head);
    const addGroup=(title,items,type)=>{ if(!items.length)return; const group=document.createElement('div'); group.className='list-group'; const gt=document.createElement('div');gt.className='list-group-title';gt.textContent=title;group.appendChild(gt);items.forEach(ch=>{const row=document.createElement('div');row.className=`list-item ${ch.cat.chipClass}`;const tx=document.createElement('div');tx.className='list-item-text';tx.textContent=ch.label;const cp=document.createElement('button');cp.type='button';cp.className='list-copy';cp.textContent='⧉';cp.title='複製完整文字';cp.setAttribute('aria-label',`複製${title}事項`);cp.onclick=e=>{e.stopPropagation();copyText(ch.label,cp)};row.append(tx,cp);group.appendChild(row)});sec.appendChild(group)};
    addGroup('個人',personal,'personal'); addGroup('教務處',school,'school');
    sec.onclick=()=>openModal(ds); root.appendChild(sec);
  }
  if(!any){const e=document.createElement('div');e.className='list-empty';e.textContent='本月尚無行程';root.appendChild(e)}
}
function setView(mode){viewMode=mode;const cal=document.querySelector('.calendar-wrap'),list=$('listView');cal.classList.toggle('hidden',mode==='list');list.classList.toggle('active',mode==='list');$('calendarModeBtn').classList.toggle('active',mode==='calendar');$('listModeBtn').classList.toggle('active',mode==='list');if(mode==='list')renderList();else requestAnimationFrame(updateSticky)}

function render(){ $('monthDisplay').textContent=`${currentYear} 年 ${currentMonth} 月`;$('subLabel').textContent=academic(currentYear,currentMonth);$('prevBtn').disabled=currentYear===MIN_YEAR&&currentMonth===MIN_MONTH;$('nextBtn').disabled=currentYear===MAX_YEAR&&currentMonth===MAX_MONTH;$('weekdaysRow').innerHTML=WEEKDAYS.map((d,i)=>`<div class="weekday${i>=5?' weekend':''}">${d}</div>`).join('');const grid=$('calendarGrid');grid.innerHTML='';const first=(new Date(currentYear,currentMonth-1,1).getDay()+6)%7,days=new Date(currentYear,currentMonth,0).getDate(),prev=new Date(currentYear,currentMonth-1,0).getDate();let cells=[];for(let i=first-1;i>=0;i--){const m=currentMonth===1?12:currentMonth-1,y=currentMonth===1?currentYear-1:currentYear;cells.push({d:prev-i,m,y,current:false})}for(let d=1;d<=days;d++)cells.push({d,m:currentMonth,y:currentYear,current:true});while(cells.length%7){const d=cells.length-first-days+1,m=currentMonth===12?1:currentMonth+1,y=currentMonth===12?currentYear+1:currentYear;cells.push({d,m,y,current:false})}const todayStr=dateKey(today.getFullYear(),today.getMonth()+1,today.getDate());cells.forEach((c,i)=>{const ds=dateKey(c.y,c.m,c.d),weekend=i%7>=5,holiday=!!SOURCE_DATA[ds]?.holiday;const cell=document.createElement('div');cell.className=`day${c.current?'':' other'}${weekend?' weekend':''}${holiday?' holiday':''}${ds===todayStr?' today':''}`;cell.innerHTML=`<div class="day-head"><span class="num">${c.d}</span>${c.current?'<span class="hint">編輯</span>':''}</div><div class="entries"></div>`;if(c.current){cell.addEventListener('click',()=>openModal(ds));const ent=cell.querySelector('.entries');if(holiday){const h=document.createElement('div');h.className='holiday-chip';h.textContent='放假';ent.appendChild(h)}const addGroup=(label,cls,chips)=>{if(!chips.length)return;const group=document.createElement('div');group.className='entry-group';const gl=document.createElement('div');gl.className=`group-label ${cls}`;gl.textContent=label;group.appendChild(gl);chips.forEach(ch=>{const e=document.createElement('div');e.className=`chip ${ch.cat.chipClass}`;e.innerHTML=`<i class="dot ${ch.cat.dotClass}"></i><span class="txt"${ch.done?' style="opacity:.55;text-decoration:line-through"':''}></span>`;e.querySelector('.txt').textContent=ch.label;group.appendChild(e)});ent.appendChild(group)};addGroup('個人','personal',personalChips(ds));addGroup('教務處','school',schoolChips(ds))}grid.appendChild(cell)});if(viewMode==='list')renderList();requestAnimationFrame(updateSticky)}
function openModal(ds){modalDateStr=ds;const[y,m,d]=ds.split('-').map(Number),week=['日','一','二','三','四','五','六'][new Date(y,m-1,d).getDay()];$('modalDateLabel').textContent=`${y} 年 ${m} 月 ${d} 日`;$('modalDateWeekday').textContent=`星期${week}`;const day=getDay(ds);tempData={};CATEGORIES.forEach(c=>tempData[c.id]=day[c.id].map(it=>({text:it.text||'',done:!!it.done})));renderModal();$('modalOverlay').classList.add('open')}
function renderModal(){const body=$('modalBody');body.innerHTML='';const src=SOURCE_DATA[modalDateStr];if(src){const rows=[];SRC_CATS.forEach(c=>(src[c.id]||[]).forEach(it=>{if(it.event||it.time||it.place)rows.push({c,it})}));if(rows.length){const sec=document.createElement('section');sec.className='section';sec.innerHTML='<div class="section-title source-title">🔄 教務處行事曆（同步，唯讀）</div>';rows.forEach(({c,it})=>{const r=document.createElement('div');r.className='source-row';r.innerHTML=`<span class="source-cat">${c.label}</span><span></span><span class="source-meta"></span><span class="source-meta"></span>`;r.children[1].textContent=it.event||'';r.children[2].textContent=it.time||'';r.children[3].textContent=it.place||'';sec.appendChild(r)});body.appendChild(sec)}}const todo=document.createElement('section');todo.className='section';todo.innerHTML='<div class="section-title">📋 代辦事項</div><div class="todo-list"></div>';const list=todo.querySelector('.todo-list'),order=getOrder(modalDateStr);order.forEach(id=>{const cat=CATEGORIES.find(c=>c.id===id),item=tempData[id][0],row=document.createElement('div');row.className=`todo-row ${cat.bgClass}`;row.dataset.catId=id;const ta=document.createElement('textarea');ta.rows=1;ta.value=item.text||'';const resize=()=>{ta.style.height='auto';ta.style.height=Math.max(42,ta.scrollHeight)+'px'};ta.addEventListener('input',()=>{tempData[id][0].text=ta.value;resize()});const copy=document.createElement('button');copy.type='button';copy.className='copy';copy.textContent='⧉';copy.setAttribute('aria-label','複製此筆代辦事項');copy.title='複製完整文字';copy.addEventListener('click',async e=>{e.stopPropagation();const value=ta.value;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{ta.focus();ta.select();document.execCommand('copy');ta.setSelectionRange(ta.value.length,ta.value.length)}copy.textContent='✓';copy.classList.add('done');setTimeout(()=>{copy.textContent='⧉';copy.classList.remove('done')},1200)}catch{copy.textContent='!';setTimeout(()=>copy.textContent='⧉',1200)}});const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='🗑';del.setAttribute('aria-label','刪除此筆代辦事項');del.title='刪除';del.addEventListener('click',e=>{e.stopPropagation();if(!ta.value.trim()||confirm('確定刪除此筆代辦事項？')){ta.value='';tempData[id][0].text='';resize();renderChips(modalDateStr)}});row.append(ta,copy,del);list.appendChild(row);setTimeout(resize,0)});todo._order=order;body.appendChild(todo)}
function closeModal(){$('modalOverlay').classList.remove('open')}
async function saveModal(){if(!DATA[modalDateStr])DATA[modalDateStr]={};document.querySelectorAll('#modalBody .todo-row').forEach(r=>{const id=r.dataset.catId,ta=r.querySelector('textarea');if(tempData[id])tempData[id][0].text=ta.value});CATEGORIES.forEach(c=>DATA[modalDateStr][c.id]=tempData[c.id].map(x=>({...x})));const order=document.querySelector('#modalBody .section:last-child')?._order||CATEGORIES.map(c=>c.id);orderData[modalDateStr]=order;closeModal();render();await saveToFirebase(modalDateStr,DATA[modalDateStr],order)}
function navigate(dir){currentMonth+=dir;if(currentMonth>12){currentMonth=1;currentYear++}if(currentMonth<1){currentMonth=12;currentYear--}if(currentYear<MIN_YEAR||(currentYear===MIN_YEAR&&currentMonth<MIN_MONTH)){currentYear=MIN_YEAR;currentMonth=MIN_MONTH}if(currentYear>MAX_YEAR||(currentYear===MAX_YEAR&&currentMonth>MAX_MONTH)){currentYear=MAX_YEAR;currentMonth=MAX_MONTH}listenMonth(currentYear,currentMonth)}
function goToday(){currentYear=today.getFullYear();currentMonth=today.getMonth()+1;listenMonth(currentYear,currentMonth);setTimeout(()=>document.querySelector('.day.today')?.scrollIntoView({block:'center'}),180)}
$('prevBtn').onclick=()=>navigate(-1);$('nextBtn').onclick=()=>navigate(1);$('todayBtn').onclick=goToday;$('calendarModeBtn').onclick=()=>setView('calendar');$('listModeBtn').onclick=()=>setView('list');$('modalClose').onclick=closeModal;$('modalSave').onclick=saveModal;$('modalOverlay').addEventListener('click',e=>{if(e.target===$('modalOverlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function clock(){const n=new Date(),w=['日','一','二','三','四','五','六'][n.getDay()];$('liveClock').textContent=`${n.getFullYear()}/${pad(n.getMonth()+1)}/${pad(n.getDate())}（星期${w}）${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`}clock();setInterval(clock,1000);new ResizeObserver(updateSticky).observe($('topHeader'));window.addEventListener('resize',updateSticky);listenMonth(currentYear,currentMonth);setTimeout(()=>document.querySelector('.day.today')?.scrollIntoView({block:'center'}),250);
</script>
